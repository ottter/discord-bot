name: Docker

# PRs build only, so a broken Dockerfile fails before it merges.
# Pushes to main and version tags also publish to GHCR.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - 'modules/**'
      - main.py
      - .github/workflows/docker.yml

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Publishing a broken image is worse than publishing nothing, so the build
  # waits on the same checks the Pylint workflow runs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pylint -r requirements.txt
      - name: Lint
        run: python -m pylint --rcfile ./.pylintrc $(git ls-files '*.py')
      - name: Verify every extension loads
        run: python scripts/check_extensions.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # only used by the push on main/tags
      attestations: write      # records what built the image
      id-token: write          # OIDC instead of a stored PAT
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # PRs never push, so they get no credentials.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows main, semver comes from tags, and every build gets an
      # immutable sha- tag worth pinning to if you want to roll back.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # What /version reports. A release build says "1.1.0"; anything else
      # says "main-6b20b25", so a running bot is always identifiable.
      - name: Work out the version string
        id: version
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "value=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.meta.outputs.version }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What /version reports: the git tag on a release, the branch and
          # short SHA otherwise, so a running bot can always be identified.
          build-args: |
            BOT_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
