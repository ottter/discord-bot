name: Docker

# Pull requests build only, to catch a broken Dockerfile before it merges.
# Pushing to main or tagging a release also publishes to GHCR.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - 'modules/**'
      - main.py
      - .github/workflows/docker.yml

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed only for the push on main/tags
      attestations: write      # records what built the image
      id-token: write          # OIDC, so no PAT is stored anywhere
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # No credentials on pull requests: those builds never push.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest follows main, :v1.2.3 and :1.2 come from tags, and every build
      # gets an immutable :sha- tag so a deployment can pin and roll back.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
