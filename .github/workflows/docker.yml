name: Docker

# PRs build only, so a broken Dockerfile fails before it merges.
# Pushes to main and version tags also publish to GHCR.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - 'modules/**'
      - main.py
      - .github/workflows/docker.yml

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Publishing a broken image is worse than publishing nothing, so pushes wait
  # on the Pylint workflow. PRs skip this, since that workflow already runs on them.
  test:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/pylint_test.yml

  docker:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # only used by the push on main/tags
      attestations: write      # records what built the image
      id-token: write          # OIDC instead of a stored PAT
      security-events: write   # Trivy results in the Security tab
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # PRs never push, so they get no credentials.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows main, semver comes from tags, and every build gets an
      # immutable sha- tag worth pinning to if you want to roll back.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # What /version reports. A release build says "1.1.0"; anything else
      # says "main-6b20b25", so a running bot is always identifiable.
      - name: Work out the version string
        id: version
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "value=${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.meta.outputs.version }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Build locally and scan before anything reaches GHCR. The push below
      # reuses these layers, so the second build is near-instant.
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bot:scan
          build-args: |
            BOT_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha

      # Only fails on CVEs that have a patch out, since those are the ones
      # we can actually do something about.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bot:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: '1'

      - name: Upload scan results
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BOT_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
