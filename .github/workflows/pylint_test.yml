name: Pylint & Test

# Pushes to main and tags get these checks through docker.yml, which calls
# this workflow before it builds.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint -r requirements.txt
    - name: Analysing the code with pylint
      run: |
        python -m pylint --rcfile ./.pylintrc $(git ls-files '*.py')

    - name: Verify every extension loads
      run: python scripts/check_extensions.py
