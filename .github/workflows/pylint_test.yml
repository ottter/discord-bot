name: Pylint & Test

# Pushes to main and tags get these checks through docker.yml, which calls
# this workflow before it builds.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Same version as the Dockerfile, since that's the only one we deploy
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
    - name: Install dependencies
      run: pip install pylint -r requirements.txt
    - name: Analysing the code with pylint
      run: |
        python -m pylint --rcfile ./.pylintrc $(git ls-files '*.py')

    - name: Verify every extension loads
      run: python scripts/check_extensions.py
