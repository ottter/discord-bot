# Copy to config.yaml and fill in. config.yaml is gitignored — never commit a real token.
#
# Any key here can also be set as a DISCORD_BOT_* environment variable, which wins over
# this file: DISCORD_BOT_PRIMARY_ACCOUNT_PREFIX sets PRIMARY_ACCOUNT_PREFIX. DISCORD_TOKEN
# is accepted bare too, so with it set in the environment you don't need this file at all.

DISCORD_TOKEN: "YOUR_BOT_TOKEN_HERE"

PRIMARY_ACCOUNT_PREFIX: ','
